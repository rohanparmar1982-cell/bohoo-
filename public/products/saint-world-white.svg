<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <!-- Hanger Gradient -->
    <linearGradient id="hangerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#333338"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>

    <!-- Tee Fabric Gradient -->
    <linearGradient id="teeWhiteGrad" x1="0%" y1="0%" x2="10% " y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="garmentShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Collar rib filter -->
    <pattern id="ribPattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#d4d4d8" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Studio Card -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>

  <!-- Subtle Industrial Grid Behind -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="1000"/>
    <line x1="700" y1="0" x2="700" y2="1000"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
  </g>

  <!-- HUD Tag at top left -->
  <text x="40" y="55" fill="#ff5500" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="2">PHOTO 01 // STORE HANGER ARCHIVE</text>
  <text x="760" y="55" fill="#71717a" font-family="monospace" font-size="13" text-anchor="end">SINDHU BHAVAN RD</text>

  <!-- Black Metal Hanger Hook -->
  <g transform="translate(400, 110)">
    <!-- Hook -->
    <path d="M 0,25 C -5,10 -15,0 -20,-15 C -25,-32 -10,-55 12,-52 C 28,-50 32,-35 22,-20 C 18,-15 5,-5 0,25" fill="none" stroke="#71717a" stroke-width="6" stroke-linecap="round"/>
    <!-- Triangular Hanger Body -->
    <polygon points="0,25 -220,110 -210,122 0,45 210,122 220,110" fill="url(#hangerGrad)" stroke="#27272a" stroke-width="2"/>
    <rect x="-18" y="25" width="36" height="18" fill="#18181b" rx="2" stroke="#3f3f46"/>
  </g>

  <!-- White Boxy T-Shirt Silhouette with Drop Shoulders -->
  <g filter="url(#garmentShadow)">
    <!-- Main Body and Sleeves Path -->
    <path d="
      M 320,150 
      C 340,165 460,165 480,150
      L 630,210
      L 710,380
      L 610,430
      L 570,360
      L 580,780
      C 580,800 560,810 540,810
      L 260,810
      C 240,810 220,800 220,780
      L 230,360
      L 190,430
      L 90,380
      L 170,210
      Z
    " fill="url(#teeWhiteGrad)" stroke="#d4d4d8" stroke-width="1.5"/>

    <!-- Subtle Fabric Fold Lines / Drop Shoulder Creases -->
    <g stroke="#cbd5e1" stroke-width="2" opacity="0.6" fill="none">
      <path d="M 230,360 Q 250,420 255,540"/>
      <path d="M 570,360 Q 550,420 545,540"/>
      <!-- Shoulder Drop Seam -->
      <path d="M 245,240 Q 235,300 230,360" stroke="#94a3b8" stroke-dasharray="3,3"/>
      <path d="M 555,240 Q 565,300 570,360" stroke="#94a3b8" stroke-dasharray="3,3"/>
    </g>

    <!-- Thick Ribbed Crewneck Collar -->
    <path d="M 320,150 C 350,185 450,185 480,150 C 465,135 335,135 320,150 Z" fill="#e4e4e7" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 330,153 C 360,175 440,175 470,153" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Stitched Internal Neck Label (DRIP STUDIOS) -->
    <g transform="translate(365, 160)">
      <rect width="70" height="24" fill="#ffffff" stroke="#cbd5e1" rx="1"/>
      <text x="35" y="13" font-family="sans-serif" font-weight="900" font-size="7" fill="#0f0f11" text-anchor="middle" letter-spacing="1">DRIP STUDIOS</text>
      <text x="35" y="21" font-family="sans-serif" font-size="5" fill="#71717a" text-anchor="middle">INDIA • L</text>
    </g>

    <!-- Side Seam Woven Label (BOHOO) as seen in photo -->
    <g transform="translate(210, 520)">
      <rect width="18" height="50" fill="#ffffff" stroke="#a1a1aa" stroke-width="1" rx="1"/>
      <text transform="rotate(-90 9 25)" x="9" y="30" font-family="sans-serif" font-weight="900" font-size="9" fill="#000000" text-anchor="middle" letter-spacing="2">BOHOO</text>
    </g>

    <!-- BOTTOM HEM TAG -->
    <g transform="translate(485, 785)">
      <rect width="18" height="30" fill="#18181b" stroke="#3f3f46" rx="1"/>
      <text x="9" y="18" font-family="monospace" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">BH</text>
    </g>

    <!-- CHEST ARTWORK: "SAINT WORLD" DISTRESSED GOTHIC STREETWEAR TYPOGRAPHY -->
    <g transform="translate(400, 380)">
      <!-- Distressed Stencil SAINT -->
      <text x="0" y="0" font-family="Impact, 'Arial Black', sans-serif" font-size="105" font-weight="900" fill="#111113" text-anchor="middle" letter-spacing="3" transform="scale(1, 1.1)">SAINT</text>
      
      <!-- Distressed Stencil WORLD -->
      <text x="0" y="105" font-family="Impact, 'Arial Black', sans-serif" font-size="112" font-weight="900" fill="#111113" text-anchor="middle" letter-spacing="2" transform="scale(1, 1.05)">WORLD</text>

      <!-- Subtext from Photo: FUTURE DREAM PROTOCOL 2026 -->
      <path id="curvePath" d="M -90,140 Q 0,150 90,140" fill="none"/>
      <text font-family="monospace" font-size="11" font-weight="bold" fill="#27272a" letter-spacing="2">
        <textPath href="#curvePath" startOffset="50%" text-anchor="middle">
          FUTURE DREAM PROTOCOL 2026
        </textPath>
      </text>

      <!-- Grunge distressed splatter marks on text -->
      <circle cx="-120" cy="-30" r="3" fill="#ffffff"/>
      <circle cx="-80" cy="40" r="2.5" fill="#ffffff"/>
      <circle cx="95" cy="-20" r="2" fill="#ffffff"/>
      <circle cx="110" cy="60" r="3.5" fill="#ffffff"/>
      <circle cx="20" cy="85" r="2" fill="#ffffff"/>
      <rect x="-40" y="-45" width="4" height="25" fill="#ffffff" opacity="0.9"/>
      <rect x="55" y="65" width="5" height="30" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- Bottom Spec Bar Badge -->
  <rect x="40" y="910" width="720" height="50" fill="#18181b" stroke="#27272a"/>
  <text x="60" y="940" fill="#ff5500" font-family="monospace" font-size="14" font-weight="bold">BOHOO AHMEDABAD // BOXY-FIT HEAVYWEIGHT</text>
  <text x="740" y="940" fill="#ededed" font-family="monospace" font-size="16" font-weight="bold" text-anchor="end">₹1,000 INR</text>
</svg>
