<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="greyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <!-- Heather Grey Melange Fabric Gradient -->
    <linearGradient id="heatherGrey" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#b0b9c6"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Distressed Red Color -->
    <linearGradient id="punkRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <filter id="greyShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#greyBg)"/>

  <!-- Maroon tee visible in background rack like in Photo 5 -->
  <rect x="150" y="80" width="500" height="180" fill="#73162b" opacity="0.3" rx="6"/>

  <!-- HUD Tag -->
  <text x="40" y="55" fill="#ff5500" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="2">PHOTO 05 // BOHOO VINTAGE COLLAGE TEE</text>
  <text x="760" y="55" fill="#71717a" font-family="monospace" font-size="13" text-anchor="end">SINDHU BHAVAN STORE</text>

  <!-- Black Metal Hanger -->
  <g transform="translate(400, 110)">
    <path d="M 0,25 C -5,10 -15,0 -20,-15 C -25,-32 -10,-55 12,-52 C 28,-50 32,-35 22,-20 C 18,-15 5,-5 0,25" fill="none" stroke="#71717a" stroke-width="6" stroke-linecap="round"/>
    <polygon points="0,25 -220,110 -210,122 0,45 210,122 220,110" fill="#27272a" stroke="#3f3f46" stroke-width="2"/>
    <rect x="-18" y="25" width="36" height="18" fill="#09090b" rx="2" stroke="#52525b"/>
  </g>

  <!-- Heather Grey Boxy T-Shirt Silhouette -->
  <g filter="url(#greyShadow)">
    <path d="
      M 320,150 
      C 340,165 460,165 480,150
      L 630,210
      L 700,380
      L 600,430
      L 570,360
      L 580,780
      L 220,780
      L 230,360
      L 200,430
      L 100,380
      L 170,210
      Z
    " fill="url(#heatherGrey)" stroke="#64748b" stroke-width="1.5"/>

    <!-- Collar -->
    <path d="M 320,150 C 350,185 450,185 480,150 C 465,135 335,135 320,150 Z" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>

    <!-- Stitched Internal Neck Label (BOHOO) as seen in photo -->
    <g transform="translate(370, 160)">
      <rect width="60" height="22" fill="#ffffff" stroke="#cbd5e1" rx="1"/>
      <text x="30" y="14" font-family="sans-serif" font-weight="900" font-size="8" fill="#000000" text-anchor="middle" letter-spacing="1">BOHOO</text>
    </g>

    <!-- Stitched Side Hem Tag (BOHOO) at bottom -->
    <g transform="translate(485, 785)">
      <rect width="18" height="35" fill="#ffffff" stroke="#94a3b8" rx="1"/>
      <text transform="rotate(-90 9 18)" x="9" y="22" font-family="sans-serif" font-weight="900" font-size="7" fill="#000000" text-anchor="middle" letter-spacing="1">BOHOO</text>
    </g>

    <!-- ================= GRAPHIC ARTWORK (PUNK ZINE COLLAGE) ================= -->
    <g transform="translate(400, 310)">
      <!-- 1. Top Script: Saints (Red Brush Calligraphy) -->
      <g transform="translate(-40, 0)">
        <text x="0" y="0" font-family="'Brush Script MT', 'Great Vibes', cursive, serif" font-size="86" font-weight="bold" fill="url(#punkRed)" stroke="#991b1b" stroke-width="1.2">Saints</text>
        <text x="25" y="24" font-family="'Times New Roman', serif" font-style="italic" font-size="16" font-weight="bold" fill="#18181b">Desires Are Forever</text>
      </g>

      <!-- Right Column Stamp: DE SI RES -->
      <g transform="translate(140, -10)">
        <text x="0" y="0" font-family="Impact, 'Arial Black', sans-serif" font-size="20" fill="url(#punkRed)">DE</text>
        <text x="0" y="18" font-family="Impact, 'Arial Black', sans-serif" font-size="20" fill="url(#punkRed)">SI</text>
        <text x="0" y="36" font-family="Impact, 'Arial Black', sans-serif" font-size="20" fill="url(#punkRed)">RES</text>
      </g>

      <!-- 2. Distressed Red Slogan Banner Box (Exact typography from photo) -->
      <g transform="translate(-130, 50)">
        <text x="0" y="22" font-family="Impact, 'Arial Black', sans-serif" font-size="28" fill="url(#punkRed)" letter-spacing="0.5">FUCK ME SO HARD</text>
        <text x="0" y="48" font-family="Impact, 'Arial Black', sans-serif" font-size="25" fill="url(#punkRed)" letter-spacing="0.5">THAT I CAN'T WALK</text>
        <text x="0" y="75" font-family="Impact, 'Arial Black', sans-serif" font-size="28" fill="url(#punkRed)" letter-spacing="0.5">ANYMORE</text>

        <!-- Subtext -->
        <text x="2" y="98" font-family="monospace" font-size="8.5" font-weight="bold" fill="#0f0f11">I WANNA DO CUTE STUFF</text>
        <text x="2" y="110" font-family="monospace" font-size="8.5" font-weight="bold" fill="#0f0f11">WITH YOU LIKE FUCK THE SHIT</text>
        <text x="2" y="122" font-family="monospace" font-size="8.5" font-weight="bold" fill="#0f0f11">OUT OF YOU</text>
      </g>

      <!-- 3. Retro Vintage Pin-up Illustration Silhouette on right side -->
      <g transform="translate(100, 70)">
        <!-- Pinup woman silhouette in lingerie with cigarette smoke -->
        <path d="
          M 20,20 C 15,10 25,-5 35,0 C 45,5 45,20 40,30
          C 35,38 32,50 34,65 C 38,80 45,95 40,115
          C 35,135 25,160 20,175 L 12,175 C 18,150 25,120 22,95
          C 18,75 12,65 15,45 C 17,35 20,25 20,20 Z
        " fill="#18181b"/>
        <!-- Arm with cigarette -->
        <path d="M 38,40 L 55,30 L 60,15 L 56,12" stroke="#18181b" stroke-width="3" fill="none"/>
        <!-- Smoke curls -->
        <path d="M 58,10 Q 65,0 55,-15 Q 70,-25 60,-35" fill="none" stroke="#71717a" stroke-width="1.5" stroke-dasharray="2,2"/>
        <text x="65" y="0" font-family="'Brush Script MT', cursive" font-size="14" fill="#3f3f46">Remember me...</text>
      </g>

      <!-- 4. Lower Left Comic Inset Card: BLONDE WITH A BRAIN -->
      <g transform="translate(-130, 200)">
        <!-- Card border -->
        <rect width="80" height="90" fill="#0f0f11" stroke="#27272a"/>
        <!-- Eyes & Hair Graphic inside card -->
        <ellipse cx="40" cy="30" rx="30" ry="20" fill="#e2e8f0"/>
        <ellipse cx="30" cy="30" rx="6" ry="8" fill="#0f0f11"/>
        <ellipse cx="50" cy="30" rx="6" ry="8" fill="#0f0f11"/>
        <!-- Speech Bubble or Caption -->
        <rect x="5" y="60" width="70" height="22" fill="#ffffff"/>
        <text x="40" y="75" font-family="Impact, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">BLONDE</text>
      </g>

      <!-- 5. "Blonde With A Brain" Typography in Red -->
      <g transform="translate(-35, 230)">
        <text x="0" y="0" font-family="'Brush Script MT', 'Great Vibes', cursive, serif" font-size="52" font-weight="bold" fill="url(#punkRed)" stroke="#991b1b" stroke-width="0.8">Blonde</text>
        <text x="0" y="42" font-family="'Brush Script MT', 'Great Vibes', cursive, serif" font-size="52" font-weight="bold" fill="url(#punkRed)" stroke="#991b1b" stroke-width="0.8">Brain</text>
        <text x="-40" y="68" font-family="monospace" font-size="9" font-weight="900" fill="#0f0f11" letter-spacing="2">BLESSED WITH BEAUTY</text>
      </g>

      <!-- Right bottom text: RAGE -->
      <g transform="translate(115, 260)">
        <text x="0" y="0" font-family="Impact, 'Arial Black', sans-serif" font-size="22" fill="url(#punkRed)" letter-spacing="1">RAGE</text>
      </g>
    </g>
  </g>

  <!-- Bottom Spec Bar Badge -->
  <rect x="40" y="910" width="720" height="50" fill="#18181b" stroke="#27272a"/>
  <text x="60" y="940" fill="#ff5500" font-family="monospace" font-size="14" font-weight="bold">BOHOO AHMEDABAD // "SAINTS" COLLAGE TEE</text>
  <text x="740" y="940" fill="#ededed" font-family="monospace" font-size="16" font-weight="bold" text-anchor="end">₹1,000 INR</text>
</svg>
